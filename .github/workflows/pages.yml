# SPDX-License-Identifier: Apache-2.0

name: Build and deploy the Sphinx report

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the report
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Install Sphinx
        run: python -m pip install -r requirements.txt

      - name: Build the report
        run: sphinx-build --fail-on-warning --keep-going -b html . _build/html

      - name: Upload the rendered site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _build/html

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

